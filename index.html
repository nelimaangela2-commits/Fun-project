<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy cafe simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <nav>
            <a class="logo" href="index.html">
                <img src="./images/cafelogo-png.png" alt="cozy cup cafe logo">
            </a>
            <ul class="nav-menu">
                <li><a href="#">Menu</a></li>
                <li><a href="#">About us</a></li>
            </ul>
        </nav>
    </header>
    <hr>
    <div class="rating-container">
        <div class="rating-badge">
            <span>⭐⭐⭐⭐⭐</span>
            <strong>4.8</strong>
            <small>500+ reviews</small>
        </div>
    </div>
    <h1>Brewed to Perfection</h1>
    <p>Perfect spot for coffee, pastries and more.</p>
    <div class="button-container">
        <button class="exploreBtn">Explore Menu</button>
    </div>

    <section class="carousel">
        <button class="carousel-btn prev" id="prevBtn">&#10094;</button>

        <div class="carousel-container">
            <div class="carousel-track" id="carouselTrack">

                <div class="carousel-card">
                    <img src="./images/cappucino.jpeg" alt="cappuccino">
                </div>

                <div class="carousel-card">
                    <img src="./images/cinammonrolls.jpeg" alt="cinammonrolls">
                </div>

                <div class="carousel-card">
                    <img src="./images/hotcocoa.jpeg" alt="hotcocoa">
                </div>

                <div class="carousel-card">
                    <img src="./images/coffeestation.jpeg" alt="the coffee station">
                </div>

                <div class="carousel-card">
                    <img src="./images/cafeview.jpeg" alt="view of the cafe">
                </div>

            </div>
        </div>

        <button class="carousel-btn next" id="nextBtn">&#10095;</button>
    </section>
<script src="index.js"></script>
</body>
</html>
